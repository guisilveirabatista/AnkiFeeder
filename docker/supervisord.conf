[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/var/log/supervisor
minfds=64

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; ---------------------------------------------------------------------------
; Virtual desktop (TigerVNC X server)
; ---------------------------------------------------------------------------
[program:xvnc]
command=/usr/local/bin/xvnc.sh
environment=HOME="/home/app",USER="app",DISPLAY=":1"
autorestart=true
priority=10
startsecs=2
stdout_logfile=/var/log/supervisor/xvnc.log
stderr_logfile=/var/log/supervisor/xvnc.err

[program:openbox]
command=/usr/bin/openbox
environment=HOME="/home/app",USER="app",DISPLAY=":1"
autorestart=true
priority=20
startsecs=1
stdout_logfile=/var/log/supervisor/openbox.log
stderr_logfile=/var/log/supervisor/openbox.err

; Browser-accessible desktop
[program:novnc]
command=/bin/bash -c "for i in $$(seq 1 30); do (echo >/dev/tcp/127.0.0.1/5900) >/dev/null 2>&1 && break; sleep 1; done; exec /usr/share/novnc/utils/novnc_proxy --vnc 127.0.0.1:5900 --listen 6080"
environment=HOME="/home/app"
autorestart=true
priority=30
stdout_logfile=/var/log/supervisor/novnc.log
stderr_logfile=/var/log/supervisor/novnc.err

; ---------------------------------------------------------------------------
; Anki (with AnkiConnect)
; Wait briefly so X is up.
; ---------------------------------------------------------------------------
[program:anki]
command=/bin/bash -c "sleep 3; exec anki"
environment=HOME="/home/app",USER="app",DISPLAY=":1",QT_QPA_PLATFORM="xcb",QT_X11_NO_MITSHM="1",LIBGL_ALWAYS_SOFTWARE="1"
autorestart=true
priority=40
startsecs=5
stdout_logfile=/var/log/supervisor/anki.log
stderr_logfile=/var/log/supervisor/anki.err

; ---------------------------------------------------------------------------
; Obsidian
; ---------------------------------------------------------------------------
[program:obsidian]
command=/bin/bash -c "sleep 4; exec /usr/local/bin/obsidian --no-sandbox --disable-gpu \"$${OBSIDIAN_VAULT}\""
environment=HOME="/home/app",USER="app",DISPLAY=":1",ELECTRON_DISABLE_SANDBOX="1",ELECTRON_OZONE_PLATFORM_HINT="x11",LIBGL_ALWAYS_SOFTWARE="1"
autorestart=true
priority=50
startsecs=5
stdout_logfile=/var/log/supervisor/obsidian.log
stderr_logfile=/var/log/supervisor/obsidian.err

; ---------------------------------------------------------------------------
; AnkiFeeder watcher — waits until AnkiConnect answers, then runs forever
; ---------------------------------------------------------------------------
[program:ankifeeder]
command=/usr/local/bin/ankifeeder-watch.sh
directory=/app/ankifeeder
environment=HOME="/home/app",USER="app",PYTHONPATH="/app/ankifeeder"
autorestart=true
priority=60
startsecs=10
stdout_logfile=/var/log/supervisor/ankifeeder.log
stderr_logfile=/var/log/supervisor/ankifeeder.err

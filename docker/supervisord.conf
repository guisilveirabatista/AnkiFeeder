[supervisord]
nodaemon=true
user=app
logfile=/var/log/supervisor/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/var/log/supervisor

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; ---------------------------------------------------------------------------
; Virtual desktop (TigerVNC X server)
; ---------------------------------------------------------------------------
[program:xvnc]
command=/bin/bash -lc "if [ -n \"$${VNC_PASSWORD_FILE}\" ] && [ -f \"$${VNC_PASSWORD_FILE}\" ]; then exec Xvnc :1 -geometry $${VNC_GEOMETRY:-1920x1080} -depth 24 -rfbport 5900 -localhost no -AlwaysShared -SecurityTypes VncAuth -PasswordFile \"$${VNC_PASSWORD_FILE}\"; else exec Xvnc :1 -geometry $${VNC_GEOMETRY:-1920x1080} -depth 24 -rfbport 5900 -localhost no -AlwaysShared -SecurityTypes None; fi"
environment=HOME="/home/app",USER="app",DISPLAY=":1",VNC_GEOMETRY="%(ENV_VNC_GEOMETRY)s",VNC_PASSWORD_FILE="%(ENV_VNC_PASSWORD_FILE)s",VNC_SECURITY_TYPES="%(ENV_VNC_SECURITY_TYPES)s"
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/xvnc.log
stderr_logfile=/var/log/supervisor/xvnc.err

[program:openbox]
command=/usr/bin/openbox
environment=HOME="/home/app",USER="app",DISPLAY=":1"
autorestart=true
priority=20
startsecs=1
stdout_logfile=/var/log/supervisor/openbox.log
stderr_logfile=/var/log/supervisor/openbox.err

; Browser-accessible desktop
[program:novnc]
command=/usr/share/novnc/utils/novnc_proxy --vnc 127.0.0.1:5900 --listen 6080
environment=HOME="/home/app"
autorestart=true
priority=30
stdout_logfile=/var/log/supervisor/novnc.log
stderr_logfile=/var/log/supervisor/novnc.err

; ---------------------------------------------------------------------------
; Anki (with AnkiConnect)
; Wait briefly so X is up.
; ---------------------------------------------------------------------------
[program:anki]
command=/bin/bash -c "sleep 3; exec anki"
environment=HOME="/home/app",USER="app",DISPLAY=":1",ANKI_BASE="%(ENV_ANKI_BASE)s",QT_QPA_PLATFORM="xcb",QT_X11_NO_MITSHM="1",LIBGL_ALWAYS_SOFTWARE="1",ANKIWEB_EMAIL="%(ENV_ANKIWEB_EMAIL)s",ANKIWEB_PASSWORD="%(ENV_ANKIWEB_PASSWORD)s",ANKIWEB_SYNC_ON_LOGIN="%(ENV_ANKIWEB_SYNC_ON_LOGIN)s"
autorestart=true
priority=40
startsecs=5
stdout_logfile=/var/log/supervisor/anki.log
stderr_logfile=/var/log/supervisor/anki.err

; ---------------------------------------------------------------------------
; Obsidian
; ---------------------------------------------------------------------------
[program:obsidian]
command=/bin/bash -c "sleep 4; exec /usr/local/bin/obsidian --no-sandbox --disable-gpu \"%(ENV_OBSIDIAN_VAULT)s\""
environment=HOME="/home/app",USER="app",DISPLAY=":1",ELECTRON_DISABLE_SANDBOX="1",ELECTRON_OZONE_PLATFORM_HINT="x11",LIBGL_ALWAYS_SOFTWARE="1",OBSIDIAN_EMAIL="%(ENV_OBSIDIAN_EMAIL)s",OBSIDIAN_PASSWORD="%(ENV_OBSIDIAN_PASSWORD)s"
autorestart=true
priority=50
startsecs=5
stdout_logfile=/var/log/supervisor/obsidian.log
stderr_logfile=/var/log/supervisor/obsidian.err

; ---------------------------------------------------------------------------
; AnkiFeeder watcher — waits until AnkiConnect answers, then runs forever
; ---------------------------------------------------------------------------
[program:ankifeeder]
command=/bin/bash -c "\
  echo 'Waiting for AnkiConnect on 127.0.0.1:8765...'; \
  for i in $$(seq 1 90); do \
    if python3 -c 'import urllib.request; r=urllib.request.Request(\"http://127.0.0.1:8765\", data=b\"{\\\"action\\\":\\\"version\\\",\\\"version\\\":6}\", headers={\"Content-Type\":\"application/json\"}); urllib.request.urlopen(r, timeout=2)' 2>/dev/null; then \
      echo 'AnkiConnect is up'; break; \
    fi; \
    sleep 2; \
  done; \
  exec /app/venv/bin/python -m ankifeeder -c \"%(ENV_ANKIFEEDER_CONFIG)s\" watch \
"
directory=/app/ankifeeder
environment=HOME="/home/app",USER="app",PYTHONPATH="/app/ankifeeder",ANTHROPIC_API_KEY="%(ENV_ANTHROPIC_API_KEY)s",OPENAI_API_KEY="%(ENV_OPENAI_API_KEY)s",GEMINI_API_KEY="%(ENV_GEMINI_API_KEY)s",ANKIFEEDER_CONFIG="%(ENV_ANKIFEEDER_CONFIG)s"
autorestart=true
priority=60
startsecs=10
stdout_logfile=/var/log/supervisor/ankifeeder.log
stderr_logfile=/var/log/supervisor/ankifeeder.err

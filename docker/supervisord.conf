[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/var/log/supervisor
minfds=64

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; ---------------------------------------------------------------------------
; Virtual desktop (TigerVNC X server)
; ---------------------------------------------------------------------------
[program:xvnc]
command=/usr/local/bin/xvnc.sh
environment=HOME="/home/app",USER="app",DISPLAY=":1"
autorestart=true
priority=10
startsecs=2
stdout_logfile=/var/log/supervisor/xvnc.log
stderr_logfile=/var/log/supervisor/xvnc.err

[program:dbus]
command=/usr/bin/dbus-daemon --session --address=unix:path=/run/user/1000/bus --nofork --nopidfile
environment=HOME="/home/app",USER="app",XDG_RUNTIME_DIR="/run/user/1000"
autorestart=true
priority=5
startsecs=1
stdout_logfile=/var/log/supervisor/dbus.log
stderr_logfile=/var/log/supervisor/dbus.err

[program:openbox]
command=/usr/bin/openbox
environment=HOME="/home/app",USER="app",DISPLAY=":1",XDG_RUNTIME_DIR="/run/user/1000",DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/1000/bus"
autorestart=true
priority=20
startsecs=1
stdout_logfile=/var/log/supervisor/openbox.log
stderr_logfile=/var/log/supervisor/openbox.err

; Browser-accessible desktop
[program:novnc]
command=/usr/local/bin/novnc.sh
environment=HOME="/home/app"
autorestart=true
priority=30
startsecs=2
stdout_logfile=/var/log/supervisor/novnc.log
stderr_logfile=/var/log/supervisor/novnc.err

; ---------------------------------------------------------------------------
; Anki (with AnkiConnect)
; Wait briefly so X is up.
; ---------------------------------------------------------------------------
[program:anki]
command=/usr/local/bin/anki.sh
environment=HOME="/home/app",USER="app",DISPLAY=":1",XDG_RUNTIME_DIR="/run/user/1000",DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/1000/bus",QT_QPA_PLATFORM="xcb",QT_X11_NO_MITSHM="1",LIBGL_ALWAYS_SOFTWARE="1",QTWEBENGINE_DISABLE_SANDBOX="1",QT_OPENGL="software"
autorestart=true
priority=40
startsecs=3
startretries=10
stdout_logfile=/var/log/supervisor/anki.log
stderr_logfile=/var/log/supervisor/anki.err

; ---------------------------------------------------------------------------
; Obsidian
; ---------------------------------------------------------------------------
[program:obsidian]
command=/usr/local/bin/obsidian.sh
environment=HOME="/home/app",USER="app",DISPLAY=":1",XDG_RUNTIME_DIR="/run/user/1000",DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/1000/bus",ELECTRON_DISABLE_SANDBOX="1",ELECTRON_OZONE_PLATFORM_HINT="x11",LIBGL_ALWAYS_SOFTWARE="1"
autorestart=true
priority=50
startsecs=3
startretries=10
stdout_logfile=/var/log/supervisor/obsidian.log
stderr_logfile=/var/log/supervisor/obsidian.err

; ---------------------------------------------------------------------------
; AnkiFeeder watcher — waits until AnkiConnect answers, then runs forever
; ---------------------------------------------------------------------------
[program:ankifeeder]
command=/usr/local/bin/ankifeeder-watch.sh
directory=/app/ankifeeder
environment=HOME="/home/app",USER="app",PYTHONPATH="/app/ankifeeder"
autorestart=true
priority=60
startsecs=10
stdout_logfile=/var/log/supervisor/ankifeeder.log
stderr_logfile=/var/log/supervisor/ankifeeder.err
